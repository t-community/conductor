name: Publish UI Docker to GHCR

on:
  push:
    branches:
      - patched-main
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v1.0.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    name: Build and push UI Docker image
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # For push events, use branch-short-sha format
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            PUBLISH_VERSION="${{ github.ref_name }}-${SHORT_SHA}"
          else
            # Use inputs.version for workflow_dispatch, or ref_name for release events
            VERSION="${{ github.event.inputs.version || github.ref_name }}"
            # Strip the 'v' prefix if present
            PUBLISH_VERSION="${VERSION#v}"
          fi
          echo "version=$PUBLISH_VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=$PUBLISH_VERSION" >> $GITHUB_ENV
          echo "Publishing version: $PUBLISH_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push UI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ui/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conductor-ui:${{ env.RELEASE_VERSION }}
            ${{ (github.event_name == 'push') && format('ghcr.io/{0}/conductor-ui:latest', github.repository_owner) || '' }}
            ${{ (github.event_name == 'release' && !github.event.release.prerelease) && format('ghcr.io/{0}/conductor-ui:latest', github.repository_owner) || '' }}
